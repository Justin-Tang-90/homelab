services:

  app:
    build: ./app
    container_name: homelab-app
    expose:
      - "5000"
    environment:
      DB_HOST: database
      DB_PORT: 5432
      DB_NAME: homelab
      DB_USER: homelab
      DB_PASSWORD: ${DB_PASSWORD}
    depends_on:
      - database
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: homelab-nginx-proxy
    ports:
      - "8081:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - app
    restart: unless-stopped

  database:
    image: postgres:16-alpine
    container_name: homelab-postgres
    environment:
      POSTGRES_DB: homelab
      POSTGRES_USER: homelab
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    expose:
      - "5432"
    restart: unless-stopped

volumes:
  postgres_data:
